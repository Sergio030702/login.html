<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolita IA - Cuba</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .container { background: #1e293b; padding: 2rem; border-radius: 1.5rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); width: 90%; max-width: 450px; text-align: center; }
        h1 { color: #38bdf8; font-size: 1.8rem; margin-bottom: 0.5rem; }
        p { color: #94a3b8; margin-bottom: 2rem; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 1rem; width: 100%; border-radius: 0.75rem; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0ea5e9; transform: scale(1.02); }
        button:disabled { background: #475569; cursor: not-allowed; }
        #resultado { margin-top: 1.5rem; text-align: left; background: #334155; padding: 1.2rem; border-radius: 0.75rem; font-size: 0.95rem; line-height: 1.6; min-height: 100px; white-space: pre-wrap; }
        .loading::after { content: "..."; animation: dots 1s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { color: rgba(0,0,0,0); text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); } 40% { color: white; text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); } 60% { text-shadow: .25em 0 0 white, .5em 0 0 rgba(0,0,0,0); } 80%, 100% { text-shadow: .25em 0 0 white, .5em 0 0 white; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🇨🇺 Bolita IA Master</h1>
        <p>Predicción inteligente por Charada y Patrones</p>
        <button id="mainBtn" onclick="obtenerPrediccion()">OBTENER PRONÓSTICO</button>
        <div id="resultado">Toca el botón para iniciar el análisis...</div>
    </div>

    <script>
        async function obtenerPrediccion() {
            const btn = document.getElementById('mainBtn');
            const resDiv = document.getElementById('resultado');
            
            btn.disabled = true;
            resDiv.innerHTML = '<span class="loading">Consultando historial y analizando patrones</span>';
            
            try {
                const response = await fetch('/api/predecir');
                const data = await response.json();
                resDiv.innerHTML = data.respuesta;
            } catch (error) {
                resDiv.innerHTML = "❌ Error de conexión. Inténtalo de nuevo.";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
