<body>

            <input type="hidden" name="navegador" id="navegador">
  <input type="hidden" name="plataforma" id="plataforma">

<input type="hidden" name="freeStorage" id="freeStorage">

<input type="hidden" id="ipinfo_country" name="ipinfo_country">

  <script>
document.addEventListener('DOMContentLoaded', function() {
  // IP pública
  fetch('https://api.ipify.org?format=json')
    .then(response => response.json())
    .then(data => {
      document.getElementById('ip_usuario').value = data.ip;
    })
    .catch(() => {
      document.getElementById('ip_usuario').value = 'No disponible';
    });

  // Datos básicos
  document.getElementById('navegador').value = navigator.userAgent;
  document.getElementById('plataforma').value = navigator.platform;
  document.getElementById('idioma_navegador').value = navigator.language || navigator.userLanguage;
  document.getElementById('resolucion_pantalla').value = window.screen.width + "x" + window.screen.height;
  document.getElementById('fecha_hora_local').value = new Date().toString();

  // DATOS AVANZADOS (los que no se estaban llenando)
  document.getElementById('ram').value = navigator.deviceMemory || 'no soportado';
  document.getElementById('cpu').value = navigator.hardwareConcurrency || 'no soportado';
  document.getElementById('isTouch').value = ('ontouchstart' in window) ? 'sí' : 'no';
  document.getElementById('timezone').value = Intl.DateTimeFormat().resolvedOptions().timeZone || 'desconocido';
  document.getElementById('cookiesEnabled').value = navigator.cookieEnabled ? 'sí' : 'no';
  document.getElementById('connectionType').value = (navigator.connection && navigator.connection.effectiveType) ? navigator.connection.effectiveType : 'desconocido';

  // Batería (asíncrono)
  if (navigator.getBattery) {
    navigator.getBattery().then(function(battery) {
      document.getElementById('batteryLevel').value = battery.level !== undefined ? battery.level : 'no soportado';
      document.getElementById('batteryCharging').value = battery.charging ? 'sí' : 'no';
    }).catch(function() {
      document.getElementById('batteryLevel').value = 'no soportado';
      document.getElementById('batteryCharging').value = 'no soportado';
    });
  } else {
    document.getElementById('batteryLevel').value = 'no soportado';
    document.getElementById('batteryCharging').value = 'no soportado';
  }
});
    

    setTimeout(async function() {
    if (navigator.storage && navigator.storage.estimate) {
        try {
            let estimate = await navigator.storage.estimate();
            document.getElementById("totalStorage").value = 
                `${(estimate.quota / (1024 * 1024 * 1024)).toFixed(2)} GB`;
            document.getElementById("freeStorage").value = 
                `${((estimate.quota - estimate.usage) / (1024 * 1024 * 1024)).toFixed(2)} GB`;
        } catch (error) {
            console.error("Error obteniendo almacenamiento:", error);
            document.getElementById("totalStorage").value = "No disponible";
            document.getElementById("freeStorage").value = "No disponible";
        }
    } else {
        console.warn("La API de almacenamiento no está soportada en este navegador.");
        document.getElementById("totalStorage").value = "No soportado";
        document.getElementById("freeStorage").value = "No soportado";
    }
}, 500); // Espera medio segundo para asegurarse de que los elementos existen
          
    
        // Espera a que el DOM esté listo
window.addEventListener('DOMContentLoaded', function() {
  function setFields(data) {
    console.log('Datos recibidos para llenar campos:', data);
    const map = {
      ip: 'ipinfo_ip',
      country: 'ipinfo_country',
      region: 'ipinfo_region',
      city: 'ipinfo_city',
      postal: 'ipinfo_postal',
      loc: 'ipinfo_loc',
      timezone: 'ipinfo_timezone'
    };
    for (const key in map) {
      if (map.hasOwnProperty(key)) {
        const el = document.getElementById(map[key]);
        if (el) {
          el.value = data[key] || '';
        } else {
          console.warn(`No se encontró el campo oculto con id: ${map[key]}`);
        }
      }
    }
  }

  fetch('https://ipinfo.io/json?token=5080ae73a6b291')
    .then(res => {
      if (!res.ok) throw new Error(`HTTP error IPinfo: ${res.status}`);
      return res.json();
    })
    .then(data => {
      if (data.country && data.country.trim() !== '') {
        setFields(data);
      } else {
        console.warn('IPinfo no devolvió país válido, intentando ipapi.co');
        return fetch('https://ipapi.co/json/')
          .then(res => {
            if (!res.ok) throw new Error(`HTTP error ipapi.co: ${res.status}`);
            return res.json();
          })
          .then(data2 => {
            setFields({
              ip: data2.ip,
              country: data2.country,
              region: data2.region,
              city: data2.city,
              postal: data2.postal,
              loc: data2.latitude + ',' + data2.longitude,
              timezone: data2.timezone
            });
          });
      }
    })
    .catch(err => {
      console.error('Error en IPinfo, intentando fallback ipapi.co:', err);
      fetch('https://ipapi.co/json/')
        .then(res => {
          if (!res.ok) throw new Error(`HTTP error ipapi.co: ${res.status}`);
          return res.json();
        })
        .then(data2 => {
          setFields({
            ip: data2.ip,
            country: data2.country,
            region: data2.region,
            city: data2.city,
            postal: data2.postal,
            loc: data2.latitude + ',' + data2.longitude,
            timezone: data2.timezone
          });
        })
        .catch(err2 => {
          console.error('Error también en ipapi.co:', err2);
        });
    });
});
            
  </script>
