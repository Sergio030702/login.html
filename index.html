<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jardín Eterno 2026 💜</title>
    <style>
        :root {
            --morado: #1a0026;
            --amarillo: #ffdb3a;
            --naranja: #e67e00;
            --rosa: #ff69b4;
            --oro: #fff700;
        }

        * { -webkit-tap-highlight-color: transparent; outline: none; box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            /* TENDENCIA 3: ASMR Fluid Background */
            background: linear-gradient(-45deg, #1a0026, #2e0046, #0d001a, #1a0026);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh; width: 100vw;
            overflow: hidden; font-family: 'Georgia', serif;
        }

        @keyframes gradientBG { 0% {background-position: 0% 50%;} 50% {background-position: 100% 50%;} 100% {background-position: 0% 50%;} }

        #trail-canvas { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 5; }
        
        #stars-container { position: absolute; width: 115%; height: 115%; top: -7.5%; left: -7.5%; transition: transform 0.2s ease-out; pointer-events: none; }
        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.5; animation: blink 3s infinite; }

        #contador {
            position: fixed; top: 20px; left: 20px; color: var(--amarillo); font-family: sans-serif;
            font-size: 0.8rem; z-index: 50; background: rgba(0,0,0,0.4);
            padding: 8px 15px; border-radius: 20px; border: 1px solid rgba(255,219,58,0.2); backdrop-filter: blur(5px);
        }

        /* TENDENCIA 1: Girasol Curioso (rotación dinámica via JS) */
        .sunflower {
            position: absolute; width: 80px; height: 80px; cursor: pointer;
            transition: opacity 0.3s, transform 0.1s linear; z-index: 10;
        }

        .golden-sunflower { z-index: 20; filter: drop-shadow(0 0 25px var(--oro)); }

        .petal {
            position: absolute; top: 50%; left: 50%; background: linear-gradient(to top, var(--naranja), var(--amarillo));
            border-radius: 50% 50% 20% 20%; transform-origin: bottom center; width: 10px; height: 35px;
            margin-left: -5px; margin-top: -35px; transition: transform 0.6s cubic-bezier(0.2, 0, 0.2, 1), opacity 0.6s;
        }

        .center {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 30px; height: 30px; background: radial-gradient(circle, #3d1a00, #1a0d00);
            border-radius: 50%; z-index: 5; box-shadow: inset 0 0 8px #000;
        }

        .heart { color: var(--rosa); font-size: 10px; animation: latido 1s infinite; text-align: center; line-height: 30px; width: 100%; }

        #modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 0, 20, 0.95); display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(10px);
        }

        .modal-content {
            background: linear-gradient(135deg, #2e0046, #1a0026);
            padding: 40px; border-radius: 30px; border: 2px solid var(--amarillo);
            text-align: center; color: white; max-width: 85%; transform: scale(0.8); transition: 0.3s;
        }

        .modal-content.show { transform: scale(1); }

        /* TENDENCIA 2: El Jarrón (Bouquet Final) */
        #final-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--morado); display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 200; color: white;
        }

        .vase {
            width: 120px; height: 150px; background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3); border-radius: 10px 10px 50px 50px;
            position: relative; margin-top: 50px; backdrop-filter: blur(5px);
        }

        .vase-flower {
            position: absolute; bottom: 100px; left: 50%; transform-origin: bottom center;
            width: 40px; height: 40px;
        }

        #blow-instruction {
            position: fixed; bottom: 10%; width: 100%; text-align: center;
            color: var(--oro); font-weight: bold; animation: pulse 2s infinite; display: none;
        }

        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
        @keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
    </style>
</head>
<body>

    <canvas id="trail-canvas"></canvas>
    <div id="contador">Pensamientos: <span id="count">0</span>/15</div>
    <div id="stars-container"></div>
    <div id="garden"></div>
    
    <div id="blow-instruction">Pide un deseo y SOPLA la pantalla... 🌬️</div>

    <div id="modal">
        <div class="modal-content" id="mContent">
            <div id="phraseText"></div>
            <button id="btnFav" class="fav-btn" onclick="addToFavorites()" style="margin-top:20px; background:var(--amarillo); border:none; padding:10px 20px; border-radius:20px;">Me Gusta ❤️</button>
            <div onclick="closeModal()" style="margin-top:25px; color:var(--amarillo); cursor:pointer;">SIGUIENTE ➔</div>
        </div>
    </div>

    <div id="final-screen">
        <h2 style="color: var(--amarillo); margin-bottom: 0;">Tu Ramo de Pensamientos</h2>
        <div class="vase" id="vase"></div>
        <button onclick="enviarWhatsApp()" style="background-color: #25d366; color: white; padding: 15px 30px; border-radius: 50px; border: none; font-weight: bold; margin-top: 40px;">Enviar por WhatsApp 📱</button>
    </div>

    <script>
        const miNumero = "56259361"; 
        const totalGirasoles = 15;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let eliminados = 0;
        let misFavoritas = [];
        let goldenFlowerCreated = false;

        // --- TENDENCIA 1: LÓGICA DE GIRASOL CURIOSO ---
        function updateSunflowerRotation(x, y) {
            document.querySelectorAll('.sunflower').forEach(sf => {
                const rect = sf.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const angle = Math.atan2(y - centerY, x - centerX) * (180 / Math.PI);
                sf.style.transform = `rotate(${angle + 90}deg)`;
            });
        }

        // --- TENDENCIA 4: DETECTOR DE SOPLIDO ---
        async function startMicCheck() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = audioCtx.createMediaStreamSource(stream);
                const analyzer = audioCtx.createAnalyser();
                source.connect(analyzer);
                const data = new Uint8Array(analyzer.frequencyBinCount);
                
                function check() {
                    if (goldenFlowerCreated) return;
                    analyzer.getByteFrequencyData(data);
                    let sum = data.reduce((a, b) => a + b);
                    if (sum > 10000) { // Umbral de soplido
                        document.getElementById('blow-instruction').style.display = 'none';
                        createSunflower(true);
                        goldenFlowerCreated = true;
                        stream.getTracks().forEach(t => t.stop());
                    } else { requestAnimationFrame(check); }
                }
                check();
            } catch (e) { createSunflower(true); } // Si no hay mic, sale sola
        }

        // --- LÓGICA DE AUDIO (LATIDO) ---
        function playRomanticTink() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.6);
        }

        // --- POLVO DE ESTRELLAS Y MOVIMIENTO ---
        const canvas = document.getElementById('trail-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        class Particle {
            constructor(x, y) { this.x = x; this.y = y; this.size = Math.random() * 3 + 1; this.speedX = Math.random() * 2 - 1; this.speedY = Math.random() * 2 - 1; this.color = `rgba(255, 219, 58, 0.7)`; }
            update() { this.x += this.speedX; this.y += this.speedY; if (this.size > 0.1) this.size -= 0.05; }
            draw() { ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
        }

        function handleInteract(x, y) {
            updateSunflowerRotation(x, y);
            for(let i=0; i<2; i++) particles.push(new Particle(x, y));
            document.getElementById('stars-container').style.transform = `translate(${(x - window.innerWidth/2)/40}px, ${(y - window.innerHeight/2)/40}px)`;
        }

        window.addEventListener('mousemove', (e) => handleInteract(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => handleInteract(e.touches[0].clientX, e.touches[0].clientY));

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => { p.update(); p.draw(); if(p.size <= 0.1) particles.splice(i, 1); });
            requestAnimationFrame(animate);
        }
        animate();

        // --- FRASES Y GIRASOLES ---
        let phrases = ["Te amo entre la sombra y el alma. 💜", "Andábamos sin buscarnos para encontrarnos. ✨", "Sos mi amor y mi cómplice. 🌻", "En un beso sabrás lo que he callado. 💋", "Eres la respuesta que nunca busqué. ✨", "Mi táctica es aprender cómo sos. 💎", "Ven a dormir conmigo, el amor nos hará. 🌙", "Para mi corazón basta tu pecho. 🦋", "Mi alma solo busca tu luz. ☀️", "Te quiero para volvernos locos de risa. 🍷", "Amo tus pies porque me encontraron. 👣", "Eres mi momento favorito. 💜", "Besos que dejan huellas de sol frío. ❄️", "Tengo el mundo en tus manos. 🌟", "Usted es el verso de mi corazón. ✍️"];
        phrases.sort(() => Math.random() - 0.5);

        function createSunflower(isLast = false) {
            const sf = document.createElement('div');
            sf.className = 'sunflower' + (isLast ? ' golden-sunflower' : '');
            sf.style.left = isLast ? '50%' : Math.random() * 70 + 15 + 'vw';
            sf.style.top = isLast ? '50%' : Math.random() * 70 + 15 + 'vh';
            if(isLast) sf.style.transform = 'translate(-50%, -50%)';

            const numPetals = isLast ? 18 : 12;
            sf.innerHTML = `<div class="center"><div class="heart">♥</div></div>${Array(numPetals).fill('<div class="petal"></div>').join('')}`;
            sf.querySelectorAll('.petal').forEach((p, i) => p.style.transform = `rotate(${i * (360/numPetals)}deg)`);

            sf.onclick = (e) => {
                e.stopPropagation(); playRomanticTink();
                sf.querySelectorAll('.petal').forEach((p, i) => {
                    p.style.transform = `rotate(${i * (360/numPetals)}deg) translateY(-250px) scale(0)`;
                    p.style.opacity = '0';
                });
                setTimeout(() => { sf.remove(); eliminados++; showModal(); }, 600);
            };
            document.getElementById('garden').appendChild(sf);
        }

        function showModal() {
            document.getElementById('phraseText').innerText = phrases[eliminados - 1];
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('btnFav').innerText = "Me Gusta ❤️";
            setTimeout(() => document.getElementById('mContent').classList.add('show'), 50);
        }

        function addToFavorites() {
            const txt = document.getElementById('phraseText').innerText;
            if(!misFavoritas.includes(txt)) {
                misFavoritas.push(txt);
                // TENDENCIA 2: Añadir flor al jarrón visualmente
                const f = document.createElement('div');
                f.className = 'vase-flower';
                f.innerHTML = '🌻'; 
                f.style.left = Math.random() * 80 + '%';
                f.style.transform = `rotate(${Math.random() * 40 - 20}deg)`;
                document.getElementById('vase').appendChild(f);
            }
            document.getElementById('btnFav').innerText = "¡En tu ramo! ✨";
            setTimeout(closeModal, 600);
        }

        function closeModal() {
            document.getElementById('mContent').classList.remove('show');
            setTimeout(() => {
                document.getElementById('modal').style.display = 'none';
                if (eliminados === totalGirasoles - 1) {
                    document.getElementById('blow-instruction').style.display = 'block';
                    startMicCheck();
                } else if (eliminados === totalGirasoles) {
                    document.getElementById('final-screen').style.display = 'flex';
                }
            }, 300);
        }

        function enviarWhatsApp() {
            let favs = misFavoritas.length > 0 ? "Mis frases favoritas:\n\n" + misFavoritas.map(f => "• " + f).join("\n\n") : "¡Me encantó todo! 💜";
            window.open(`https://api.whatsapp.com/send?phone=${miNumero}&text=${encodeURIComponent("🌻 ¡He completado mi jardín!\n\n" + favs)}`, '_blank');
        }

        // Estrellas de fondo
        for (let i = 0; i < 60; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.width = s.style.height = Math.random() * 2 + 1 + 'px';
            s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 100 + '%';
            document.getElementById('stars-container').appendChild(s);
        }
        for (let i = 0; i < totalGirasoles - 1; i++) createSunflower(false);
    </script>
</body>
</html>
