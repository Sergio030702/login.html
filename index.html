<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jardín Eterno 💜</title>
    <style>
        :root {
            --morado: #1a0026;
            --amarillo: #ffdb3a;
            --naranja: #e67e00;
            --rosa: #ff69b4;
            --oro: #fff700;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            outline: none;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--morado);
            height: 100vh; width: 100vw;
            overflow: hidden;
            font-family: 'Georgia', serif;
            touch-action: none;
        }

        #stars-container {
            position: absolute; width: 110%; height: 110%;
            top: -5%; left: -5%; transition: transform 0.1s ease-out;
            pointer-events: none;
        }

        .star {
            position: absolute; background: white; border-radius: 50%;
            opacity: 0.5; animation: moveStars 15s linear infinite;
        }

        #contador {
            position: fixed; top: 20px; left: 20px;
            color: var(--amarillo); font-family: sans-serif;
            font-size: 0.8rem; z-index: 50;
            background: rgba(0,0,0,0.4);
            padding: 8px 15px; border-radius: 20px;
            border: 1px solid rgba(255,219,58,0.2);
            backdrop-filter: blur(5px);
        }

        .sunflower {
            position: absolute; width: 100px; height: 100px;
            cursor: pointer; transition: opacity 0.4s, transform 0.4s;
            transform-style: preserve-3d;
            animation: flotar 4s ease-in-out infinite;
        }

        .golden-sunflower {
            z-index: 10;
            filter: drop-shadow(0 0 25px var(--oro));
            animation: emergenciaDorada 1.5s cubic-bezier(0.17, 0.67, 0.83, 0.67) forwards, 
                       brilloAura 2s ease-in-out infinite 1.5s;
        }
        
        .golden-sunflower .petal {
            background: linear-gradient(to top, #ffcc00, #ffffff) !important;
            height: 50px !important;
            width: 14px !important;
        }

        .golden-sunflower .ring {
            border: 3px solid white !important;
            box-shadow: 0 0 30px white;
        }

        @keyframes emergenciaDorada {
            0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1.8) rotate(360deg); opacity: 1; }
        }

        @keyframes brilloAura {
            0%, 100% { filter: drop-shadow(0 0 15px var(--oro)); }
            50% { filter: drop-shadow(0 0 40px white); }
        }

        .ring {
            position: absolute; width: 90px; height: 90px;
            border: 2px solid var(--amarillo); border-radius: 50%;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 10px var(--amarillo); z-index: 2;
        }

        .petal {
            position: absolute; top: 50%; left: 50%;
            background: linear-gradient(to top, var(--naranja), var(--amarillo));
            border-radius: 50% 50% 20% 20% / 80% 80% 20% 20%;
            transform-origin: bottom center; width: 12px; height: 42px;
            margin-left: -6px; margin-top: -42px;
        }

        .center {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 38px; height: 38px; background: radial-gradient(circle, #3d1a00, #1a0d00);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            z-index: 5; box-shadow: inset 0 0 10px #000;
        }

        .heart { color: var(--rosa); font-size: 14px; animation: latido 1s infinite; }

        #modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 0, 20, 0.95); display: none;
            justify-content: center; align-items: center; z-index: 100;
            backdrop-filter: blur(10px);
        }

        .modal-content {
            background: linear-gradient(135deg, #2e0046, #1a0026);
            padding: 40px; border-radius: 30px; border: 2px solid var(--amarillo);
            text-align: center; color: white; max-width: 80%;
            transform: scale(0.8); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-content.show { transform: scale(1); }

        .fav-btn {
            margin-top: 15px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--amarillo); color: white;
            padding: 12px 20px; border-radius: 30px; cursor: pointer;
            font-size: 0.9rem; transition: 0.3s;
        }

        .fav-btn.selected { background: var(--rosa); border-color: var(--rosa); transform: scale(1.1); }

        #final-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--morado); display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 200;
            color: white; text-align: center;
        }

        .btn-whatsapp {
            background-color: #25d366; color: white; padding: 18px 35px;
            border-radius: 50px; text-decoration: none; font-weight: bold;
            font-family: sans-serif; margin-top: 30px; border: none;
            box-shadow: 0 10px 20px rgba(37, 211, 102, 0.3);
        }

        @keyframes moveStars { from { transform: translateY(0); } to { transform: translateY(-100vh); } }
        @keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
    </style>
</head>
<body>

    <div id="contador">Pensamientos: <span id="count">0</span>/15</div>
    <div id="stars-container"></div>
    <div id="garden"></div>

    <div id="modal">
        <div class="modal-content" id="mContent">
            <div id="phraseText" style="font-size: 1.2rem; font-style: italic; line-height: 1.6; margin-bottom: 20px;"></div>
            <button id="btnFav" class="fav-btn" onclick="addToFavorites(event)">Me Gusta ❤️</button>
            <div style="margin-top:30px; color: var(--amarillo); letter-spacing: 2px; font-size: 0.8rem; cursor: pointer;" onclick="closeModal()">SIGUIENTE ➔</div>
        </div>
    </div>

    <div id="final-screen">
        <h1 style="color: var(--amarillo); font-size: 2rem;">¡Jardín Completo! 🌻</h1>
        <p style="opacity: 0.8; padding: 0 30px;">Has recogido cada pensamiento que guardé para ti.</p>
        <button onclick="enviarWhatsApp()" class="btn-whatsapp">Díselo por WhatsApp 📱</button>
    </div>

    <script>
        const miNumero = "56259361"; 
        const totalGirasoles = 15;

        // NUEVA FUNCIÓN DE SONIDO DE CAMPANILLA (SIN ARCHIVOS EXTERNOS)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playRomanticTink() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            // Tono agudo tipo cristal (Nota La5)
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.8);

            if (navigator.vibrate) navigator.vibrate(20);
        }

        let phrases = [
            "Te amo como se aman ciertas cosas oscuras, entre la sombra y el alma. (Neruda) 💜",
            "Andábamos sin buscarnos, pero sabiendo que para encontrarnos. (Cortázar) ✨",
            "Si te quiero es porque sos mi amor, mi cómplice y todo. (Benedetti) 🌻",
            "En un beso, sabrás todo lo que he callado. (Pablo Neruda) 💋",
            "Tú eres la respuesta que nunca busqué, pero que siempre necesité. ✨",
            "Mi táctica es mirarte, aprender como sos, quererte como sos. (Benedetti) 💎",
            "Ven a dormir conmigo: no haremos el amor, él nos hará a nosotros. (Cortázar) 🌙",
            "Para mi corazón basta tu pecho, para tu libertad bastan mis alas. (Neruda) 🦋",
            "Si el girasol busca el sol, mi alma solo sabe buscar tu luz. ☀️",
            "Te quiero para volvernos locos de risa, ebrios de nada. (Cortázar) 🍷",
            "Amo tus pies porque anduvieron sobre la tierra hasta encontrarme. (Neruda) 👣",
            "Tú eres mi momento favorito de todos los días. 💜",
            "Hay besos que en los labios dejan huellas de un sol frío. (Gabriela Mistral) ❄️",
            "Tengo el mundo entero en tus manos y el cielo en tu mirada. 🌟",
            "Usted es la mujer por la que mi corazón late en verso. ✍️",
            "La magia no es un truco, la magia es que existas tú. 🎩✨",
            "Espero curarme de ti en unos días. (Sabines) 🚬",
            "No te cambio por nadie, porque nadie tiene tu forma de mirar. 👁️‍🗨️",
            "Nacimos para encontrarnos, mi vida es un jardín desde que estás tú. 🌸",
            "Queda prohibido no sonreír a los problemas. (Neruda) ☀️"
        ];

        phrases.sort(() => Math.random() - 0.5);
        let eliminados = 0;
        let misFavoritas = [];

        const starsWrap = document.getElementById('stars-container');
        for (let i = 0; i < 50; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.width = s.style.height = Math.random() * 3 + 'px';
            s.style.left = Math.random() * 100 + '%';
            s.style.top = Math.random() * 100 + '%';
            s.style.animationDuration = Math.random() * 10 + 5 + 's';
            starsWrap.appendChild(s);
        }

        window.addEventListener('deviceorientation', (event) => {
            const x = event.beta; const y = event.gamma; 
            starsWrap.style.transform = `translate(${y / 3}px, ${x / 3}px)`;
        });

        function createSunflower(isLast = false) {
            const garden = document.getElementById('garden');
            const sf = document.createElement('div');
            sf.className = 'sunflower' + (isLast ? ' golden-sunflower' : '');
            
            if (isLast) {
                sf.style.left = '50%';
                sf.style.top = '50%';
                sf.style.transform = 'translate(-50%, -50%)';
            } else {
                sf.style.left = Math.random() * 75 + 10 + 'vw';
                sf.style.top = Math.random() * 75 + 10 + 'vh';
            }

            const numPetals = isLast ? 16 : 12;
            sf.innerHTML = `<div class="ring"></div>${Array(numPetals).fill('<div class="petal"></div>').join('')}<div class="center"><div class="heart">♥</div></div>`;
            
            const degStep = 360 / numPetals;
            sf.querySelectorAll('.petal').forEach((p, i) => p.style.transform = `rotate(${i * degStep}deg)`);

            sf.onclick = (e) => {
                e.stopPropagation();
                playRomanticTink(); 
                sf.style.opacity = '0';
                sf.style.transform = isLast ? 'translate(-50%, -50%) scale(6)' : 'scale(2.5)';
                setTimeout(() => { 
                    sf.remove(); 
                    eliminados++;
                    document.getElementById('count').innerText = Math.min(eliminados, totalGirasoles);
                    showModal(); 
                }, 400);
            };
            garden.appendChild(sf);
        }

        function showModal() {
            const btn = document.getElementById('btnFav');
            btn.innerText = "Me Gusta ❤️";
            btn.classList.remove('selected');
            document.getElementById('phraseText').innerText = phrases[eliminados - 1];
            document.getElementById('modal').style.display = 'flex';
            setTimeout(() => document.getElementById('mContent').classList.add('show'), 10);
        }

        function addToFavorites(e) {
            e.stopPropagation();
            const txt = document.getElementById('phraseText').innerText;
            if(!misFavoritas.includes(txt)) misFavoritas.push(txt);
            document.getElementById('btnFav').innerText = "¡En tu colección! ✨";
            document.getElementById('btnFav').classList.add('selected');
            setTimeout(closeModal, 700);
        }

        function closeModal() {
            document.getElementById('mContent').classList.remove('show');
            setTimeout(() => {
                document.getElementById('modal').style.display = 'none';
                if (eliminados === totalGirasoles - 1) {
                    createSunflower(true);
                } else if (eliminados === totalGirasoles) {
                    document.getElementById('final-screen').style.display = 'flex';
                }
            }, 300);
        }

        function enviarWhatsApp() {
            let favs = misFavoritas.length > 0 ? "Mis frases favoritas:\n\n" + misFavoritas.map(f => "• " + f).join("\n\n") : "¡Me encantaron todas! 💜";
            const url = `https://api.whatsapp.com/send?phone=${miNumero}&text=${encodeURIComponent("🌻 ¡He completado tu jardín!\n\n" + favs)}`;
            window.open(url, '_blank');
        }

        // Lanzar los primeros 14 girasoles
        for (let i = 0; i < totalGirasoles - 1; i++) createSunflower(false);
    </script>
</body>
</html>
